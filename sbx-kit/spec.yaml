schemaVersion: "2"
kind: sandbox
name: pi
displayName: Pi
description: Minimal terminal coding agent with extensible tools, skills, and TUI
sandbox:
  # Build and import with bin/build-image; see README.image.md.
  image: pissbox:local
  entrypoint:
    - pi
    - --offline
agentInstructions:
  filename: AGENTS.md
permissions:
  network:
    allow:
      # pi's runtime package installs (extensions, skills, prompt templates,
      # themes) and the packages named in settings, fetched on startup.
      - registry.npmjs.org
      - opencode.ai
      - github.com
      - pi.dev
      - huggingface.co
setup:
  install:
    - command: 'if [ -n "${HTTP_PROXY:-}" ]; then npm config set proxy="$HTTP_PROXY" https-proxy="${HTTPS_PROXY:-$HTTP_PROXY}"; fi'
      user: "1000"
      description: Set npm proxy options from HTTP_PROXY and HTTPS_PROXY
    - command: 'sh "$HOME/.pissbox/scripts/link-pi-agent.sh"'
      user: "1000"
      description: Link the mounted host Pi directory to Pi's default config path
    - command: 'bash "$HOME/.pissbox/scripts/link-shared-directories.sh"'
      user: "1000"
      description: Link shared Linux model, index, and package caches
    - command: 'config="$HOME/.local/share/colgrep/config.json"; if [ ! -e "$config" ] && [ ! -L "$config" ]; then cp /opt/pissbox/colgrep-config.json "$config"; fi'
      user: "1000"
      description: Seed the bundled search model default without replacing shared settings
    - command: 'npm config set cache "$HOME/.cache/npm" --location=user'
      user: "1000"
      description: Use the shared npm cache without replacing image cache data
    - command: 'bash "$HOME/.pissbox/scripts/run-project-setup.sh"'
      user: "1000"
      description: Run primary-workspace .pissbox.toml setup commands once before starting Pi
